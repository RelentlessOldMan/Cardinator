name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest   # WPF (net8.0-windows) needs Windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      # Golden-image tests compare against baselines rendered on the author's machine; font
      # anti-aliasing differs on the CI image, so they're a local-only regression guard.
      - name: Test
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~GoldenTests"

      - name: Headless render smoke test
        run: |
          $exe = "src/Cardinator/bin/Release/net8.0-windows/win-x64/Cardinator.exe"
          & $exe --selftest "${{ runner.temp }}/selftest"
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
