name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest   # WPF (net8.0-windows) needs Windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      # Golden-image tests compare against baselines rendered on the author's machine; font
      # anti-aliasing differs on the CI image, so they're a local-only regression guard. The
      # remaining tests already render cards headlessly (STA threads), covering the pipeline.
      - name: Test
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~GoldenTests"
